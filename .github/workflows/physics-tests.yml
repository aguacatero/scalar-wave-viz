name: Physics baseline tests
on:
  push:
  pull_request:
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: MPLBACKEND=Agg python examples/electrostatics_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: conventional-electrostatics-preview
          path: |
            electrostatics_baseline.png
            electrostatics_manifest.json
          retention-days: 30
          if-no-files-found: error
