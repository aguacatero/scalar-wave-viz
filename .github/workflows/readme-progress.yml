name: README progress guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  readme-progress:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head with full history
        uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha }}"
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test README progress guard
        run: python -m unittest discover -s tests -p 'test_readme_progress_guard.py' -v
      - name: Require progress report change for substantive PRs
        env:
          BASE_REF: "${{ github.event.pull_request.base.ref }}"
          HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          python scripts/check_readme_progress.py --base-ref "$BASE_REF" --head-sha "$HEAD_SHA"
